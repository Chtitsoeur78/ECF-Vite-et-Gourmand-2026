<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="GaleriePhotosStyles.css">
    <title>Galerie de Photos n° 2</title>
</head>
<body>
<h1>Ma Galerie Photos n° 2</h1>
<div class="galerie">
    <figure>
        <img src="../Images/Adelaide11.jpg" alt="Photo 1 : Adelaide - Australie méridionale">
        <figcaption>Adelaide (Australie méridionale) vue des bords de la Torrens </figcaption>
    </figure>
    <figure>
        <img src="../Images/Albanywa12.jpg" alt="Photo 2 : Albany - Australie occidentale">
        <figcaption>Albany (Australie méridionale) </figcaption>
    </figure>
    <figure>
        <img src="../Images/CRSCKB21.jpg" alt="Photo 3 : Entre Perth et Kalgoorlie - Australie occidentale">
        <figcaption>La canalisation qui transporte l'eau entre Perth et Kalgoorlie en Australie occidentale</figcaption>
    </figure>
    <figure>
        <img src="../Images/KangarooIslandSeaLions1.jpg"  alt="Photo 4 : Les lions de Mer deKangaroo Island - Australie méridionale">
        <figcaption>Les lions de Mer de Kangaroo Island en Australie méridionale</figcaption>
    </figure>
    <figure>
        <img src="../Images/LacHillier121.jpg" alt="Photo 5 : Le Lac Hillier - Australie occidentale">
        <figcaption>Le lac Hillier, un des lacs roses d'Australie occidentale</figcaption>
    </figure>
    <figure>
        <img src="../Images/melbournetramway21.jpg" alt="Photo 6 : Le tramway de Melbourne - Victoria">
        <figcaption>Le Tramway dans les rues de Melbourne, capitale du Victoria</figcaption>
    </figure>
    <figure>
        <img src="../Images/operasydney21.jpg" alt="L'Opéra de Sydney - Nouvelle-Galles du Sud">
        <figcaption>L'Opéra et le Pont de Sydney en Nouvelle-Galles du Sud </figcaption>
    </figure>
    <figure>
        <img src="../Images/Uluru11.jpg" alt="Uluru - Territoire du Nord">
        <figcaption> Dans le Territoire du Nord, Uluru, le monolithe du Centre Rouge vu du ciel</figcaption>
    </figure>
</div>
<!--Lightbox-->    
<div class="lightbox" id="lightbox">
<span class="close" id="closeBtn">&times;</span>
<img src="" alt="image agrandie">
</div>  
<script src="GaleriePhotosScript.js"></script>    
</body>
</html>
